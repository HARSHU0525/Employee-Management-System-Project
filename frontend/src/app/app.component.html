<div class="container">

  <h1>Employee Management System</h1>

  <!-- Add Employee Form -->
  <div class="form-container">

    <h2>Add Employee</h2>

    <form (ngSubmit)="addEmployee()">

      <div class="form-group">
        <label>Name</label>
        <input
          type="text"
          [(ngModel)]="employee.name"
          name="name"
          placeholder="Enter name"
          required
        />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="employee.email"
          name="email"
          placeholder="Enter email"
          required
        />
      </div>

      <div class="form-group">
        <label>Department</label>
        <input
          type="text"
          [(ngModel)]="employee.department"
          name="department"
          placeholder="Enter department"
          required
        />
      </div>

      <div class="form-group">
        <label>Salary</label>
        <input
          type="number"
          [(ngModel)]="employee.salary"
          name="salary"
          placeholder="Enter salary"
          required
        />
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input
          type="text"
          [(ngModel)]="employee.phone"
          name="phone"
          placeholder="Enter phone"
        />
      </div>

      <button type="submit">
        Add Employee
      </button>

    </form>

    <p *ngIf="message" class="message">
      {{ message }}
    </p>

  </div>

  <hr>

  <!-- Employee List -->
  <div class="employee-list">

    <h2>Employee List</h2>

    <p *ngIf="employees.length === 0">
      No employees found.
    </p>

    <table *ngIf="employees.length > 0">

      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Department</th>
          <th>Salary</th>
          <th>Phone</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let emp of employees; let i = index">

          <td>{{ emp.id }}</td>
          <td>{{ emp.name }}</td>
          <td>{{ emp.email }}</td>
          <td>{{ emp.department }}</td>
          <td>{{ emp.salary }}</td>
          <td>{{ emp.phone }}</td>

          <td>
            <button
              type="button"
              class="delete-btn"
              (click)="deleteEmployee(emp.id!, i)">
              Delete
            </button>
          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
