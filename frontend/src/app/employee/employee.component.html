<div class="employee-container">

  <h1>Add Employee</h1>

  <!-- Add Employee Form -->
  <form (ngSubmit)="addEmployee()">

    <div class="form-group">
      <label>Name</label>
      <input
        type="text"
        name="name"
        [(ngModel)]="employee.name"
        placeholder="Enter employee name"
        required
      />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        name="email"
        [(ngModel)]="employee.email"
        placeholder="Enter email"
        required
      />
    </div>

    <div class="form-group">
      <label>Department</label>
      <input
        type="text"
        name="department"
        [(ngModel)]="employee.department"
        placeholder="Enter department"
        required
      />
    </div>

    <div class="form-group">
      <label>Salary</label>
      <input
        type="number"
        name="salary"
        [(ngModel)]="employee.salary"
        placeholder="Enter salary"
        required
      />
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input
        type="text"
        name="phone"
        [(ngModel)]="employee.phone"
        placeholder="Enter phone number"
        required
      />
    </div>

    <button type="submit" class="add-button">
      Add Employee
    </button>

  </form>


  <!-- Success / Error Messages -->
  @if (message) {
    <p class="success">{{ message }}</p>
  }

  @if (errorMessage) {
    <p class="error">{{ errorMessage }}</p>
  }


  <!-- Update Button -->
  @if (showUpdateButton) {

    <div class="update-button-section">
      <button
        type="button"
        class="update-open-button"
        (click)="openUpdateForm()">
        Update Employee
      </button>
    </div>

  }


  <!-- Update Form -->
  @if (showUpdateForm) {

    <div class="update-section">

      <hr>

      <h1>Update Employee</h1>

      <form (ngSubmit)="updateEmployee()">

        <div class="form-group">
          <label>Employee ID</label>
          <input
            type="number"
            name="updateId"
            [(ngModel)]="employee.id"
            readonly
          />
        </div>

        <div class="form-group">
          <label>Name</label>
          <input
            type="text"
            name="updateName"
            [(ngModel)]="employee.name"
            placeholder="Enter employee name"
            required
          />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            name="updateEmail"
            [(ngModel)]="employee.email"
            placeholder="Enter email"
            required
          />
        </div>

        <div class="form-group">
          <label>Department</label>
          <input
            type="text"
            name="updateDepartment"
            [(ngModel)]="employee.department"
            placeholder="Enter department"
            required
          />
        </div>

        <div class="form-group">
          <label>Salary</label>
          <input
            type="number"
            name="updateSalary"
            [(ngModel)]="employee.salary"
            placeholder="Enter salary"
            required
          />
        </div>

        <div class="form-group">
          <label>Phone</label>
          <input
            type="text"
            name="updatePhone"
            [(ngModel)]="employee.phone"
            placeholder="Enter phone number"
            required
          />
        </div>

        <button type="submit" class="update-submit-button">
          Update Employee
        </button>

        <button
          type="button"
          class="cancel-button"
          (click)="cancelUpdate()">
          Cancel
        </button>

      </form>

    </div>

  }

</div>
